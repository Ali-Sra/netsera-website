services:
  postgres:
    image: postgres:16-alpine
    container_name: netsera-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netsera}
      POSTGRES_USER: ${POSTGRES_USER:-netsera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netsera} -d ${POSTGRES_DB:-netsera}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/src/Netsera.Api/Dockerfile
    container_name: netsera-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-netsera};Username=${POSTGRES_USER:-netsera};Password=${POSTGRES_PASSWORD:-change_me}
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: