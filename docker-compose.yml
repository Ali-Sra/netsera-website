services:
  postgres:
    image: postgres:16-alpine
    container_name: netsera-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netsera}
      POSTGRES_USER: ${POSTGRES_USER:-netsera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netsera} -d ${POSTGRES_DB:-netsera}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
